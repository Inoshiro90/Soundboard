<!--
  Fragment: sound-fx-pipeline.html  ·  Familie: Sound
  Zweck:    Pipeline-Editor, Ebenen 2–3: Stufe verwalten, Preset wählen, Layer bearbeiten
  Modals:   fxStageModal (Ebene 2), fxPresetPickerModal (2b), fxLayerModal (Ebene 3)
  JS:       js/dialogs/fx-pipeline-modals.js (+ js/ui/fx-pipeline-editor.js für die Übersicht)
  Geladen:  js/fragmentLoader.js (Liste in js/main.js), VOR registerEvents().
  Stapel:   soundFxModal → fxStageModal → (fxPresetPickerModal | fxLayerModal) → fxPresetMetaModal
            (ui/modal-stack.js staffelt die z-Indizes; das jeweils verdeckte Modal ist inert).
  Jedes Modal hat genau EINE Aufgabe; der Titel nennt sie.
-->

  <!-- ═════ EBENE 2 · STUFE VERWALTEN ═════ Arbeitskopie der Stufe: Reihenfolge, Hinzufügen, Duplizieren, Entfernen.
       Erst „Übernehmen“ schreibt die Arbeitskopie in den Draft des Effekt-Dialogs. -->
  <div class="modal fade" id="fxStageModal" tabindex="-1" aria-labelledby="fxStageModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-size-standard">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title fx-modal-title" id="fxStageModalTitle">
            <span class="fx-modal-title__icon" id="fxStageModalIcon" aria-hidden="true"></span>
            <span id="fxStageModalTitleText">Stufe verwalten</span>
          </span>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><span data-icon-slot="x"></span></button>
        </div>
        <div class="modal-body">
          <p class="fx-modal-context u-text-muted u-text-badge" id="fxStageContext"></p>
          <div class="fx-stage-modal__state">
            <label class="fx-toggle sm-inline-toggle" title="Stufe ein/aus">
              <input type="checkbox" role="switch" id="fxStageEnabled" aria-describedby="fxStageEnabledText">
              <span class="fx-toggle__track"></span>
            </label>
            <span id="fxStageEnabledText" class="fx-stage-modal__state-text"></span>
          </div>
          <p class="u-text-muted u-text-badge" id="fxStageHint"></p>
          <p class="fx-stage-modal__order u-text-muted u-text-badge">Reihenfolge = Verarbeitungsreihenfolge: Der oberste Layer wird zuerst verarbeitet.</p>
          <ol class="fx-layers" id="fxStageLayers" aria-label="Layer in Verarbeitungsreihenfolge"></ol>
          <div class="fx-stage-modal__add">
            <button type="button" class="btn btn--sm" id="btnFxStageAddPreset"><span data-icon-slot="plus"></span> Preset hinzufügen</button>
            <button type="button" class="btn btn--sm" id="btnFxStageAddManual"><span data-icon-slot="plus"></span> Manuell hinzufügen</button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn--sm" id="btnFxStageCancel" data-bs-dismiss="modal">Abbrechen</button>
          <button type="button" class="btn btn--sm btn--accent" id="btnFxStageApply"><span data-icon-slot="check"></span> Übernehmen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═════ EBENE 2b · PRESET WÄHLEN ═════ Nur Presets der aktuellen Stufe, nach Gruppen. Auswahl = neue Layer-Instanz
       in der Arbeitskopie der Stufe. Verwaltung eigener Presets (Bearbeiten/Duplizieren/Löschen/Export, Import). -->
  <div class="modal fade" id="fxPresetPickerModal" tabindex="-1" aria-labelledby="fxPresetPickerTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-size-standard">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title fx-modal-title" id="fxPresetPickerTitle">
            <span class="fx-modal-title__icon" id="fxPresetPickerIcon" aria-hidden="true"></span>
            <span id="fxPresetPickerTitleText">Preset hinzufügen</span>
          </span>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><span data-icon-slot="x"></span></button>
        </div>
        <div class="modal-body">
          <p class="fx-modal-context u-text-muted u-text-badge" id="fxPresetPickerContext"></p>
          <div class="fx-picker" id="fxPresetPickerList"></div>
        </div>
        <div class="modal-footer fx-picker__footer">
          <span class="u-text-muted u-text-badge">Eigene Presets:</span>
          <button type="button" class="btn btn--sm" id="btnFxPresetImportTrigger" title="Preset(s) aus JSON-Datei importieren"><span data-icon-slot="upload"></span> Importieren</button>
          <button type="button" class="btn btn--sm" id="btnFxPresetExportAll" title="Alle eigenen Presets als eine JSON-Datei exportieren"><span data-icon-slot="download"></span> Alle exportieren</button>
          <input type="file" id="fxPresetImportInput" accept="application/json,.json" hidden>
          <span class="fx-spacer"></span>
          <button type="button" class="btn btn--sm" data-bs-dismiss="modal">Schließen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═════ EBENE 3 · LAYER BEARBEITEN ═════ Ein Layer, vollständiges Effektformular (dieselben fx*-IDs wie immer, genau
       einmal im DOM). „Übernehmen“ schreibt in die Arbeitskopie der Stufe, „Abbrechen“ verwirft. -->
  <div class="modal fade" id="fxLayerModal" tabindex="-1" aria-labelledby="fxLayerModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-size-editor modal-fixed-h">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title fx-modal-title" id="fxLayerModalTitle">
            <span class="fx-modal-title__icon" id="fxLayerModalIcon" aria-hidden="true"></span>
            <span id="fxLayerModalTitleText">Layer bearbeiten</span>
          </span>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><span data-icon-slot="x"></span></button>
        </div>
        <div class="modal-body sm-body">
          <p class="fx-modal-context u-text-muted u-text-badge" id="fxLayerContext"></p>

          <section class="fx-layer-preset" id="fxLayerPresetBlock" aria-labelledby="fxLayerPresetHead">
            <div class="fx-layer-preset__info">
              <span class="fx-layer-preset__head" id="fxLayerPresetHead">Layer</span>
              <span class="fx-layer-preset__name" id="fxLayerPresetName"></span>
              <span class="fx-layer__tag" id="fxLayerPresetTag" hidden></span>
            </div>
            <p class="u-text-muted u-text-badge" id="fxLayerPresetNote"></p>
            <p class="fx-layer__tag fx-layer__tag--warn fx-layer__missing" id="fxLayerPresetMissing" role="status" hidden></p>
            <!-- Phase 9: Makro-Regler des Presets (js/ui/effects/macro-bar.js); verborgen, wenn das Preset keine hat -->
            <div class="fx-macros" id="fxLayerMacros" hidden></div>
            <div class="fx-layer-preset__actions">
              <button type="button" class="btn btn--sm" id="btnFxPresetSaveAs" title="Einstellungen dieses Layers als neues eigenes Preset speichern"><span data-icon-slot="save"></span> Als eigenes Preset speichern</button>
              <button type="button" class="btn btn--sm" id="btnFxPresetEdit" title="Name, Stufe, Gruppe und Beschreibung des eigenen Presets ändern" hidden><span data-icon-slot="pencil"></span> Preset-Details</button>
              <button type="button" class="btn btn--sm" id="btnFxPresetDuplicate" title="Preset als eigenes Preset duplizieren" hidden><span data-icon-slot="copy"></span> Preset duplizieren</button>
              <button type="button" class="btn btn--sm btn--danger" id="btnFxPresetDelete" title="Eigenes Preset löschen" hidden><span data-icon-slot="trash"></span> Preset löschen</button>
              <button type="button" class="btn btn--sm" id="btnFxPresetExport" title="Preset als JSON exportieren" hidden><span data-icon-slot="download"></span> Preset exportieren</button>
              <button type="button" class="btn btn--sm" id="btnFxLayerRestore" title="Layer auf die ursprünglichen Werte des Presets zurücksetzen" hidden><span data-icon-slot="refresh-cw"></span> Preset-Werte wiederherstellen</button>
              <button type="button" class="btn btn--sm btn--ghost" id="btnFxReset" title="Alle Effektmodule dieses Layers auf Standardwerte zurücksetzen"><span data-icon-slot="rotate-ccw"></span> Layer zurücksetzen</button>
            </div>
          </section>

          <!-- Phase 8: Ansichts-Schalter („Nur aktive Module zeigen“) erzeugt js/ui/effects/effect-editor.js; bewusst AUSSERHALB von #fxLayerForm. -->
          <div class="fx-toolbar u-mt-2" data-fx-toolbar></div>

          <div id="fxLayerForm">
          <div class="disclosure-group sm-level1" id="fxDisclosureGroup" data-disclosure-multi>

          <!-- 2. Filters -->
          <div class="disclosure-section">
            <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
              aria-expanded="false" aria-controls="smFxFilters" id="smFxFiltersToggle">
              <span class="disclosure-section__label">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-arrow-up-down" aria-hidden="true"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg> Filter (Lowpass / Highpass)
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="disclosure-section__panel" id="smFxFilters" hidden>
              <!-- Phase 8: Karten für Tiefpass, Hochpass und Notch erzeugt js/ui/effects/ aus der Registry (kein handgeschriebenes Effekt-HTML). -->
              <div class="fx-host u-mt-2" data-fx-host data-fx-modules="lowpass,highpass,notch,bandpass,autoFilter"></div>
            </div>
          </div>

          <!-- 3. EQ -->
          <div class="disclosure-section">
            <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
              aria-expanded="false" aria-controls="smFxEQ" id="smFxEQToggle">
              <span class="disclosure-section__label">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-sliders-horizontal" aria-hidden="true"><path d="M10 5H3"/><path d="M12 19H3"/><path d="M14 3v4"/><path d="M16 17v4"/><path d="M21 12h-9"/><path d="M21 19h-5"/><path d="M21 5h-7"/><path d="M8 10v4"/><path d="M8 12H3"/></svg> Equalizer (3-Band + 10-Band)
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="disclosure-section__panel" id="smFxEQ" hidden>
              <!-- Phase 8: Karten für 3-Band-EQ und 10-Band-EQ erzeugt js/ui/effects/ aus der Registry. -->
              <div class="fx-host u-mt-2" data-fx-host data-fx-modules="eq,eq10,paramEq"></div>
            </div>
          </div>

          <!-- 4. Dynamics -->
          <div class="disclosure-section">
            <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
              aria-expanded="false" aria-controls="smFxDyn" id="smFxDynToggle">
              <span class="disclosure-section__label">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-zap" aria-hidden="true"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></svg> Dynamics (Compressor / Limiter)
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="disclosure-section__panel" id="smFxDyn" hidden>
              <!-- Phase 8: Karten für Kompressor und Limiter erzeugt js/ui/effects/ aus der Registry. -->
              <div class="fx-host u-mt-2" data-fx-host data-fx-modules="compressor,limiter,noiseGate,expander"></div>
            </div>
          </div>

          <!-- 5. Distortion -->
          <div class="disclosure-section">
            <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
              aria-expanded="false" aria-controls="smFxDist" id="smFxDistToggle">
              <span class="disclosure-section__label">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-flame" aria-hidden="true"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></svg> Distortion
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="disclosure-section__panel" id="smFxDist" hidden>
              <!-- Phase 8: Karten für Verzerrung und Ringmodulation erzeugt js/ui/effects/ aus der Registry. -->
              <div class="fx-host u-mt-2" data-fx-host data-fx-modules="distortion,ringmod"></div>
            </div>
          </div>

          <!-- 5.5 Modulation: Tremolo, Chorus, Flanger -->
          <div class="disclosure-section">
            <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
              aria-expanded="false" aria-controls="smFxMod" id="smFxModToggle">
              <span class="disclosure-section__label">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-audio-waveform" aria-hidden="true"><path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2"/></svg> Modulation (Tremolo / Chorus /
                Flanger)
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="disclosure-section__panel" id="smFxMod" hidden>
              <!-- Phase 8: Karten für Tremolo, Chorus, Flanger und Wahwah erzeugt js/ui/effects/ aus der Registry. -->
              <div class="fx-host u-mt-2" data-fx-host data-fx-modules="tremolo,chorus,flanger,wahwah"></div>
            </div>
          </div>

          <!-- 6. Reverb -->
          <div class="disclosure-section">
            <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
              aria-expanded="false" aria-controls="smFxReverb" id="smFxReverbToggle">
              <span class="disclosure-section__label">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-waves-horizontal" aria-hidden="true"><path d="M2 12q2.5 2 5 0t5 0 5 0 5 0"/><path d="M2 19q2.5 2 5 0t5 0 5 0 5 0"/><path d="M2 5q2.5 2 5 0t5 0 5 0 5 0"/></svg> Reverb / Hall
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="disclosure-section__panel" id="smFxReverb" hidden>
              <!-- Phase 8: Karten für die beiden Hall-Arten erzeugt js/ui/effects/ aus der Registry. -->
              <div class="fx-host u-mt-2" data-fx-host data-fx-modules="reverb,irReverb"></div>
            </div>
          </div>

          <!-- 7. Delay -->
          <div class="disclosure-section">
            <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
              aria-expanded="false" aria-controls="smFxDelay" id="smFxDelayToggle">
              <span class="disclosure-section__label">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-repeat" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg> Delay / Echo
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="disclosure-section__panel" id="smFxDelay" hidden>
              <!-- Phase 8: Karte für Echo/Delay erzeugt js/ui/effects/ aus der Registry. -->
              <div class="fx-host u-mt-2" data-fx-host data-fx-modules="delay"></div>
            </div>
          </div>

          <!-- 8. Spatial 3D -->
          <div class="disclosure-section">
            <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
              aria-expanded="false" aria-controls="smFxSpatial" id="smFxSpatialToggle">
              <span class="disclosure-section__label">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-headphones" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg> 3D Raumklang (HRTF)
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="disclosure-section__panel" id="smFxSpatial" hidden>
              <!-- Phase 8: Karte für den 3D-Raumklang erzeugt js/ui/effects/ aus der Registry. -->
              <div class="fx-host u-mt-2" data-fx-host data-fx-modules="spatial"></div>
            </div>
          </div>

          <!-- 9. Pitch / Advanced -->
          <div class="disclosure-section">
            <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
              aria-expanded="false" aria-controls="smFxAdvanced" id="smFxAdvancedToggle">
              <span class="disclosure-section__label">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-music" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> Pitch / Advanced
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="disclosure-section__panel" id="smFxAdvanced" hidden>
              <!-- Phase 8: Karten für Tonhöhe und Noise Gate erzeugt js/ui/effects/ aus der Registry. -->
              <div class="fx-host u-mt-2" data-fx-host data-fx-modules="pitchShift"></div>
              
              
            </div>
          </div>
</div><!-- /fxDisclosureGroup -->
          </div>
        </div>
        <div class="modal-footer u-flex-between">
          <span class="u-text-muted u-text-badge" id="fxLayerFooterHint">Die Vorschau folgt den Reglern sofort; gespeichert wird erst nach „Übernehmen“.</span>
          <div class="u-flex u-gap-2 fx-preview-bar">
            <!-- Phase 7: dieselbe Vorschau-Steuerung wie im Effekt-Dialog (Preview-Pegel, Loop, A/B, Start/Stopp). -->
            <div class="master-meter fx-preview-meter" id="previewMeterLayer" role="img" aria-label="Vorschau-Pegel" hidden>
              <span class="master-meter__bar"><span class="master-meter__fill" id="previewMeterBarLLayer"></span></span>
              <span class="master-meter__bar"><span class="master-meter__fill" id="previewMeterBarRLayer"></span></span>
              <span class="fx-preview-meter__text u-text-badge" id="previewMeterTextLayer"></span>
            </div>
            <button type="button" class="btn btn--sm" id="btnPreviewLoopLayer" aria-pressed="false" title="Vorschau wiederholen (gilt ab dem nächsten Start)">Loop</button>
            <button type="button" class="btn btn--sm" id="btnPreviewABLayer" aria-pressed="false" disabled title="A/B: Effekte kurz umgehen und das Original hören">A/B</button>
            <button type="button" class="btn btn--sm" id="btnPreviewFxLayer" aria-label="Vorschau abspielen" title="Vorschau abspielen" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-play u-text-accent" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg><span class="btn__label">Vorschau</span></button>
            <button type="button" class="btn btn--sm" id="btnFxLayerCancel" data-bs-dismiss="modal">Abbrechen</button>
            <button type="button" class="btn btn--sm btn--accent" id="btnFxLayerApply"><span data-icon-slot="check"></span> Übernehmen</button>
          </div>
        </div>
      </div>
    </div>
  </div>
