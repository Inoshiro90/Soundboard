<!--
  Fragment: ambient.html  ·  Familie: Ambient
  Zweck:    Ambient-Szenen-Dialoge
  Modals:   ambientVolumeModal, ambProfModal, ambTrackIconModal, ambientFxToolbarModal
  JS:       js/dialogs/ambient-modal.js, js/ambient/ambient-events.js
  Geladen:  js/fragmentLoader.js (Liste in js/main.js), VOR registerEvents() — IDs/Klassen/ARIA unverändert.
-->

  <!-- ═══════════════════════════ LAUTSTÄRKE-DIALOG (AMBIENT) ════════════════════
       #ambientMasterVol/#ambientMasterVolNum bleiben APP.ambient.masterVol,
       s. setAmbientMasterVolume()-Logik/Event-Handler
       (ambient/ambient-events.js registerAmbientEvents()). -->
  <div class="modal fade" id="ambientVolumeModal" tabindex="-1" aria-labelledby="ambientVolumeModalTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-size-compact">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title" id="ambientVolumeModalTitle">
            <svg xmlns="http://www.w3.org/2000/svg" class="svg-modal-title" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-volume-2" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
            Lautstärke
          </span>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>
        <div class="modal-body sm-body">
          <div class="vol-row">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-volume-2" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
            <input type="range" id="ambientMasterVol" class="slider" min="0" max="1" step=".01" value="1"
              aria-label="Ambient-Gesamtlautstärke">
            <input type="number" id="ambientMasterVolNum" class="vol-number-input" min="0" max="100" value="100"
              aria-label="Ambient-Gesamtlautstärke Prozent">
            <span class="u-text-muted u-text-badge">%</span>
          </div>
        </div>
        <div class="modal-footer u-flex-between">
          <span></span>
          <button type="button" class="btn btn--sm btn--accent" data-bs-dismiss="modal">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-check" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Fertig
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ AMBIENT-SZENE: NEU / BEARBEITEN ═══════════════════════════════════ -->
  <div class="modal fade" id="ambProfModal" tabindex="-1" aria-labelledby="ambProfModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-size-standard">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="ambProfModalTitle">Szene</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>

        <div class="modal-body">
          <label class="form-label" for="ambProfNameInput">Name</label>
          <input class="form-control" id="ambProfNameInput" placeholder="z.B. Marktplatz, Höhle, Schlachtfeld">

          <!-- Icon/Farbe als gemeinsame Progressive-Disclosure-Gruppe —
               siehe #profDisclosureGroup in #profModal. Audio-Effekte
               leben im Toolbar-Button/-Dialog (#ambientFxToolbarModal)
               für die jeweils AKTIVE Szene. -->
          <div class="disclosure-group u-mt-3" id="ambProfDisclosureGroup">

            <div class="disclosure-section">
              <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
                aria-expanded="false" aria-controls="ambProfSecIcon" id="ambProfSecIconToggle">
                <span class="disclosure-section__label">
                  <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-face-slightly-smiling" aria-hidden="true"><path d="M15 10V9"/><path d="M16.472 15a6 6 0 01-8.943 0"/><path d="M9 10V9"/><circle cx="12" cy="12" r="10"/></svg> Icon
                </span>
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="disclosure-section__panel" id="ambProfSecIcon" hidden>
                <!-- Icon picker injected by buildIconGrid() -->
                <div id="ambProfIconGrid" class="icon-grid" aria-hidden="true"></div>
                <input class="form-control icon-direct-input u-mt-2" id="ambProfIconInput" placeholder="🌫️" maxlength="4" aria-label="Emoji direkt eingeben">
              </div>
            </div>

            <div class="disclosure-section">
              <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
                aria-expanded="false" aria-controls="ambProfSecColor" id="ambProfSecColorToggle">
                <span class="disclosure-section__label">
                  <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-palette" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg> Farbe
                </span>
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="disclosure-section__panel" id="ambProfSecColor" hidden>
                <!-- Color picker injected by buildColorOpts() -->
                <div id="ambProfColorOpts" class="color-row" role="radiogroup" aria-label="Akzentfarbe der Szene"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer u-flex-between">
          <div class="u-flex u-gap-2">
            <button type="button" class="btn btn--sm btn--danger" id="btnDelAmbientProfile" style="display:none" aria-label="Szene löschen">
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-trash" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Löschen
            </button>
          </div>
          <div class="u-flex u-gap-2">
            <button type="button" class="btn btn--sm" data-bs-dismiss="modal">Abbrechen</button>
            <button type="button" class="btn btn--sm btn--accent" id="btnSaveAmbientProfile">Speichern</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ══ AMBIENT-TRACK: ICON WÄHLEN ═════════════════════════════════════════ -->
  <div class="modal fade" id="ambTrackIconModal" tabindex="-1" aria-labelledby="ambTrackIconModalTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-size-standard">
      <div class="modal-content">

        <div class="modal-header">
          <span class="modal-title" id="ambTrackIconModalTitle">
            <svg xmlns="http://www.w3.org/2000/svg" class="svg-modal-title" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-face-slightly-smiling" aria-hidden="true"><path d="M15 10V9"/><path d="M16.472 15a6 6 0 01-8.943 0"/><path d="M9 10V9"/><circle cx="12" cy="12" r="10"/></svg>
            Icon auswählen
          </span>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>

        <div class="modal-body">
          <!-- Icon picker injected by buildIconGrid() -->
          <div id="ambTrackIconGrid" class="icon-grid" aria-hidden="true"></div>
          <input class="form-control icon-direct-input u-mt-2" id="ambTrackIconInput" placeholder="🌫️" maxlength="4" aria-label="Emoji direkt eingeben">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn--sm" data-bs-dismiss="modal">Abbrechen</button>
          <button type="button" class="btn btn--sm btn--accent" id="btnApplyAmbientTrackIcon">Übernehmen</button>
        </div>

      </div>
    </div>
  </div>

  <div class="modal fade" id="ambientFxToolbarModal" tabindex="-1" aria-labelledby="ambientFxToolbarModalTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-size-standard">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title" id="ambientFxToolbarModalTitle">
            <svg xmlns="http://www.w3.org/2000/svg" class="svg-modal-title" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-sliders-horizontal" aria-hidden="true"><path d="M10 5H3"/><path d="M12 19H3"/><path d="M14 3v4"/><path d="M16 17v4"/><path d="M21 12h-9"/><path d="M21 19h-5"/><path d="M21 5h-7"/><path d="M8 10v4"/><path d="M8 12H3"/></svg> Audio-Effekte
          </span>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>
        <div class="modal-body sm-body">
          <p class="u-text-muted u-mb-2" id="ambientFxToolbarActiveLabel">Szene: —</p>

          <label class="form-label" for="ambProfFxPreset">Preset</label>
          <select class="form-select form-select-sm fx-preset-select" id="ambProfFxPreset">
            <option value="">— Kein Preset —</option>
          </select>

          <div class="u-mt-3">
            <span class="form-label u-block">Preset auf enthaltene Ambient-Tracks anwenden</span>
            <div class="u-flex u-gap-2 u-wrap" role="group" aria-label="Überschreibungsmodus" id="ambProfFxModeGroup">
              <button type="button" class="btn btn--sm" data-mode="all" id="ambProfFxModeAll" aria-pressed="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-square preview-icon" aria-hidden="true">
                  <rect width="18" height="18" x="3" y="3" rx="2" />
                </svg>
                Alle
              </button>
              <button type="button" class="btn btn--sm" data-mode="same" id="ambProfFxModeSame" aria-pressed="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-square-equal preview-icon" aria-hidden="true">
                  <rect width="18" height="18" x="3" y="3" rx="2" />
                  <path d="M7 10h10" />
                  <path d="M7 14h10" />
                </svg>
                Gleiche
              </button>
              <button type="button" class="btn btn--sm is-active" data-mode="none" id="ambProfFxModeNone" aria-pressed="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-square-x preview-icon" aria-hidden="true">
                  <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                  <path d="m15 9-6 6" />
                  <path d="m9 9 6 6" />
                </svg>
                Keine
              </button>
            </div>
            <button type="button" class="btn btn--accent u-mt-2" id="ambProfFxApplyBtn">
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-wand-sparkles" aria-hidden="true"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg> Anwenden
            </button>
          </div>
        </div>
        <div class="modal-footer u-flex-between">
          <span></span>
          <button type="button" class="btn btn--sm btn--accent" data-bs-dismiss="modal">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-check" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Fertig
          </button>
        </div>
      </div>
    </div>
  </div>
