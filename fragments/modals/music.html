<!--
  Fragment: music.html  ·  Familie: Musik
  Zweck:    Musik-Playlist-Dialoge
  Modals:   musicProfileModal, musicTrackModal, musicPlaybackModal, musicVolumeModal, musicFxToolbarModal
  JS:       js/dialogs/music-modal.js, js/music/music-events.js
  Geladen:  js/fragmentLoader.js (Liste in js/main.js), VOR registerEvents() — IDs/Klassen/ARIA unverändert.
-->

  <!-- ═══════════════════════ MUSIK-PLAYLIST-MODAL ══════════════════════════════
       Echter Bootstrap-Dialog, strukturell/visuell analog zu
       #profModal/#ambProfModal. Icon/Farbe nutzen dieselben zentralen
       buildIconGrid()/buildColorOpts()-Picker — kein playlist-eigener Picker.
       Geöffnet über das CustomEvent 'music:editProfile' (dispatcht von
       js/music/music-events.js, vermeidet einen zirkulären Import
       music-events.js ⇄ dialogs/music-modal.js — gleiches Prinzip wie
       'music:editTrack'/#musicTrackModal oben). -->
  <div class="modal fade" id="musicProfileModal" tabindex="-1" aria-labelledby="musicProfileModalTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="musicProfileModalTitle">Playlist</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>

        <div class="modal-body">
          <label class="form-label" for="musicProfNameInput">Name</label>
          <input class="form-control" id="musicProfNameInput" placeholder="z.B. Tavernenmusik">

          <!-- Icon/Farbe als gemeinsame Progressive-Disclosure-Gruppe —
               siehe #profDisclosureGroup in #profModal. Audio-Effekte
               leben im Toolbar-Button/-Dialog (#musicFxToolbarModal) für
               die jeweils AKTIVE Playlist. -->
          <div class="disclosure-group u-mt-3" id="musicProfDisclosureGroup">

            <div class="disclosure-section">
              <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
                aria-expanded="false" aria-controls="musicProfSecIcon" id="musicProfSecIconToggle">
                <span class="disclosure-section__label">
                  <i class="fa-solid fa-face-smile" aria-hidden="true"></i> Emoji / Icon
                </span>
                <i class="fa-solid fa-chevron-down disclosure-section__chevron" aria-hidden="true"></i>
              </button>
              <div class="disclosure-section__panel" id="musicProfSecIcon" hidden>
                <!-- Icon picker injected by buildIconGrid() -->
                <div id="musicProfIconGrid" class="icon-grid" aria-hidden="true"></div>
                <input class="form-control u-mt-2" id="musicProfIconInput" placeholder="🎵" maxlength="4"
                  style="font-size:1.1rem;text-align:center" aria-label="Emoji direkt eingeben">
              </div>
            </div>

            <div class="disclosure-section">
              <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
                aria-expanded="false" aria-controls="musicProfSecColor" id="musicProfSecColorToggle">
                <span class="disclosure-section__label">
                  <i class="fa-solid fa-palette" aria-hidden="true"></i> Farbe
                </span>
                <i class="fa-solid fa-chevron-down disclosure-section__chevron" aria-hidden="true"></i>
              </button>
              <div class="disclosure-section__panel" id="musicProfSecColor" hidden>
                <!-- Color picker injected by buildColorOpts() -->
                <div id="musicProfColorOpts" class="color-row" aria-label="Akzentfarbe der Playlist"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer u-flex-between">
          <div class="u-flex u-gap-2">
            <button class="btn btn--danger" id="btnDelMusicProfile" style="display:none" aria-label="Playlist löschen">
              <i class="fa-solid fa-trash" aria-hidden="true"></i> Löschen
            </button>
          </div>
          <div class="u-flex u-gap-2">
            <button class="btn" data-bs-dismiss="modal">Abbrechen</button>
            <button class="btn btn--accent" id="btnSaveMusicProfile">Speichern</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ═══════════════════════ MUSIK-TRACK BEARBEITEN ═══════════════════════
       Bewusst NUR musikrelevante Felder (Name/Artist/Album/Icon/Farbe/
       Lautstärke) — keine Sound-spezifischen Felder wie Hotkey, Zufall,
       One-shot oder Makro, die für einen Musiktrack keinen Sinn ergeben. -->
  <div class="modal fade" id="musicTrackModal" tabindex="-1" aria-labelledby="musicTrackModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="musicTrackModalTitle">Musikstück bearbeiten</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>

        <div class="modal-body">
          <label class="form-label" for="musicEditName">Name</label>
          <input class="form-control u-mb-3" id="musicEditName" maxlength="60" aria-label="Trackname">

          <label class="form-label" for="musicEditArtist">Künstler / Interpret</label>
          <input class="form-control u-mb-3" id="musicEditArtist" maxlength="60" aria-label="Künstler">

          <label class="form-label" for="musicEditAlbum">Album</label>
          <input class="form-control u-mb-3" id="musicEditAlbum" maxlength="60" aria-label="Album">

          <label class="form-label">Icon</label>
          <!-- Icon picker injected by buildIconGrid() -->
          <div id="musicIconGrid" class="icon-grid u-mb-2" aria-hidden="true"></div>
          <input class="form-control u-mb-3" id="musicIconInput" placeholder="🎵" maxlength="4"
            style="font-size:1.1rem;text-align:center" aria-label="Emoji direkt eingeben">

          <label class="form-label">Akzentfarbe</label>
          <!-- Color swatches injected by buildColorOpts() -->
          <div class="color-row u-mb-3" id="musicClrOpts"></div>

          <label class="form-label" for="musicEditVol">Lautstärke</label>
          <div class="u-flex u-gap-2" style="align-items:center">
            <input type="range" class="slider" id="musicEditVol" min="0" max="1" step=".01" value="1"
              aria-label="Track-Lautstärke" style="flex:1">
            <span class="u-text-badge u-text-mono" id="musicEditVolLbl">100%</span>
          </div>

          <!-- Audio-Effekte per Progressive Disclosure statt dauerhaft
               sichtbarem Block — zentrales System aus disclosure.js
               (data-disclosure-inline), wie in #profModal/#ambProfModal/
               #musicProfileModal. Audio-Effekt-Preset für diesen
               Musik-Track — dieselbe zentrale Preset-Infrastruktur wie
               Sound/Ambient (getAllPresets()/applyPresetEffects(),
               renderPresetOptions() statt eines zweiten
               Musik-Effektmodells). -->
          <div class="disclosure-group u-mt-3" id="musicEditDisclosureGroup">
            <div class="disclosure-section">
              <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
                aria-expanded="false" aria-controls="musicEditFxSec" id="musicEditFxSecToggle">
                <span class="disclosure-section__label">
                  <i class="fa-solid fa-sliders" aria-hidden="true"></i> Audio-Effekte
                </span>
                <i class="fa-solid fa-chevron-down disclosure-section__chevron" aria-hidden="true"></i>
              </button>
              <div class="disclosure-section__panel" id="musicEditFxSec" hidden>
                <label class="form-label" for="musicEditFxPreset">Preset</label>
                <select class="form-select form-select-sm fx-preset-select" id="musicEditFxPreset">
                  <option value="">— Kein Preset —</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn--danger" id="btnMusicEditDelete">
            <i class="fa-solid fa-trash" aria-hidden="true"></i> Löschen
          </button>
          <button class="btn" id="btnMusicEditExport" title="Dieses Musikstück als Datei exportieren"
            aria-label="Musikstück exportieren">
            <i class="fa-solid fa-file-export" aria-hidden="true"></i> Export
          </button>
          <button class="btn" data-bs-dismiss="modal">Abbrechen</button>
          <button class="btn btn--accent" id="btnMusicEditSave">Speichern</button>
        </div>

      </div>
    </div>
  </div>

  <!-- ═════════════════════════ WIEDERGABE-DIALOG (MUSIK) ════════════════════════
       Crossfade + Autoplay, analog zu #playbackSettingsModal (Sound).
       #musicCrossfade/#musicAutoplay: state bleibt APP.music.crossfade/
       APP.music.autoplay, s. setMusicCrossfade()/setMusicAutoplay(). -->
  <div class="modal fade" id="musicPlaybackModal" tabindex="-1" aria-labelledby="musicPlaybackModalTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content sm-content">
        <div class="modal-header">
          <h5 class="modal-title" id="musicPlaybackModalTitle">
            <i class="fa-solid fa-play" aria-hidden="true"></i>
            Wiedergabe
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>
        <div class="modal-body sm-body">
          <div class="music-player__settings">
            <label for="musicCrossfade">Crossfade
              <select id="musicCrossfade" aria-label="Crossfade-Dauer in Sekunden">
                <option value="0">Aus (harter Wechsel)</option>
                <option value="1">1 s</option>
                <option value="2" selected>2 s</option>
                <option value="3">3 s</option>
                <option value="5">5 s</option>
                <option value="10">10 s</option>
              </select>
            </label>
            <label for="musicAutoplay">
              <input type="checkbox" id="musicAutoplay" checked>
              Automatisch nächsten Track abspielen
            </label>
          </div>
        </div>
        <div class="modal-footer u-flex-between">
          <span></span>
          <button class="btn btn--sm btn--accent" data-bs-dismiss="modal">
            <i class="fa-solid fa-check" aria-hidden="true"></i> Fertig
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════ LAUTSTÄRKE-DIALOG (MUSIK) ══════════════════════
       #musicMasterVol/#musicMasterVolNum bleiben APP.music.masterVol, s.
       setMusicMasterVolume(). Lautstärke ist NUR hier sichtbar, nicht im
       Player. -->
  <div class="modal fade" id="musicVolumeModal" tabindex="-1" aria-labelledby="musicVolumeModalTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content sm-content">
        <div class="modal-header">
          <h5 class="modal-title" id="musicVolumeModalTitle">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path
                d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
              <path d="M16 9a5 5 0 0 1 0 6" />
              <path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
            </svg>
            Lautstärke
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>
        <div class="modal-body sm-body">
          <div class="u-flex u-gap-2" style="align-items:center">
            <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
            <input type="range" id="musicMasterVol" class="slider" style="flex:1" min="0" max="1" step=".01" value="1"
              aria-label="Musik-Gesamtlautstärke">
            <input type="number" id="musicMasterVolNum" class="menubar-volume__number" min="0" max="100" value="100"
              aria-label="Musik-Gesamtlautstärke Prozent">
            <span class="u-text-muted u-text-badge">%</span>
          </div>
        </div>
        <div class="modal-footer u-flex-between">
          <span></span>
          <button class="btn btn--sm btn--accent" data-bs-dismiss="modal">
            <i class="fa-solid fa-check" aria-hidden="true"></i> Fertig
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="musicFxToolbarModal" tabindex="-1" aria-labelledby="musicFxToolbarModalTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content sm-content">
        <div class="modal-header">
          <h5 class="modal-title" id="musicFxToolbarModalTitle">
            <i class="fa-solid fa-sliders" aria-hidden="true"></i> Audio-Effekte
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>
        <div class="modal-body sm-body">
          <p class="u-text-muted u-mb-2" id="musicFxToolbarActiveLabel">Playlist: —</p>

          <label class="form-label" for="musicProfFxPreset">Preset</label>
          <select class="form-select form-select-sm fx-preset-select" id="musicProfFxPreset">
            <option value="">— Kein Preset —</option>
          </select>

          <div class="u-mt-3">
            <span class="form-label u-block">Preset auf enthaltene Musik-Tracks anwenden</span>
            <div class="u-flex u-gap-2 u-wrap" role="group" aria-label="Überschreibungsmodus" id="musicProfFxModeGroup">
              <button type="button" class="btn btn--sm" data-mode="all" id="musicProfFxModeAll" aria-pressed="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-square preview-icon" aria-hidden="true">
                  <rect width="18" height="18" x="3" y="3" rx="2" />
                </svg>
                Alle
              </button>
              <button type="button" class="btn btn--sm" data-mode="same" id="musicProfFxModeSame" aria-pressed="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-square-equal preview-icon" aria-hidden="true">
                  <rect width="18" height="18" x="3" y="3" rx="2" />
                  <path d="M7 10h10" />
                  <path d="M7 14h10" />
                </svg>
                Gleiche
              </button>
              <button type="button" class="btn btn--sm is-active" data-mode="none" id="musicProfFxModeNone" aria-pressed="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-square-x preview-icon" aria-hidden="true">
                  <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                  <path d="m15 9-6 6" />
                  <path d="m9 9 6 6" />
                </svg>
                Keine
              </button>
            </div>
            <button type="button" class="btn btn--accent u-mt-2" id="musicProfFxApplyBtn">
              <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> Anwenden
            </button>
          </div>
        </div>
        <div class="modal-footer u-flex-between">
          <span></span>
          <button class="btn btn--sm btn--accent" data-bs-dismiss="modal">
            <i class="fa-solid fa-check" aria-hidden="true"></i> Fertig
          </button>
        </div>
      </div>
    </div>
  </div>
