<!--
  Fragment: music.html  ·  Familie: Musik
  Zweck:    Musik-Playlist-Dialoge
  Modals:   musicProfileModal, musicTrackModal, musicTrackAppearanceModal, musicPlaybackModal, musicVolumeModal, musicFxToolbarModal
  JS:       js/dialogs/music-modal.js, js/music/music-events.js
  Geladen:  js/fragmentLoader.js (Liste in js/main.js), VOR registerEvents() — IDs/Klassen/ARIA unverändert.
-->

  <!-- ═══════════════════════ MUSIK-PLAYLIST-MODAL ══════════════════════════════
       Echter Bootstrap-Dialog, strukturell/visuell analog zu
       #profModal/#ambProfModal. Icon/Farbe nutzen dieselben zentralen
       buildIconGrid()/buildColorOpts()-Picker — kein playlist-eigener Picker.
       Geöffnet über das CustomEvent 'music:editProfile' (dispatcht von
       js/music/music-events.js, vermeidet einen zirkulären Import
       music-events.js ⇄ dialogs/music-modal.js — gleiches Prinzip wie
       'music:editTrack'/#musicTrackModal oben). -->
  <div class="modal fade" id="musicProfileModal" tabindex="-1" aria-labelledby="musicProfileModalTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-size-standard">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="musicProfileModalTitle">Playlist</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>

        <div class="modal-body">
          <label class="form-label" for="musicProfNameInput">Name</label>
          <input class="form-control" id="musicProfNameInput" placeholder="z.B. Tavernenmusik">

          <!-- Icon/Farbe als gemeinsame Progressive-Disclosure-Gruppe —
               siehe #profDisclosureGroup in #profModal. Audio-Effekte
               leben im Toolbar-Button/-Dialog (#musicFxToolbarModal) für
               die jeweils AKTIVE Playlist. -->
          <div class="disclosure-group u-mt-3" id="musicProfDisclosureGroup">

            <div class="disclosure-section">
              <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
                aria-expanded="false" aria-controls="musicProfSecIcon" id="musicProfSecIconToggle">
                <span class="disclosure-section__label">
                  <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-face-slightly-smiling" aria-hidden="true"><path d="M15 10V9"/><path d="M16.472 15a6 6 0 01-8.943 0"/><path d="M9 10V9"/><circle cx="12" cy="12" r="10"/></svg> Icon
                </span>
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="disclosure-section__panel" id="musicProfSecIcon" hidden>
                <!-- Icon picker injected by buildIconGrid() -->
                <div id="musicProfIconGrid" class="icon-grid" aria-hidden="true"></div>
                <input class="form-control icon-direct-input u-mt-2" id="musicProfIconInput" placeholder="🎵" maxlength="4" aria-label="Emoji direkt eingeben">
              </div>
            </div>

            <div class="disclosure-section">
              <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
                aria-expanded="false" aria-controls="musicProfSecColor" id="musicProfSecColorToggle">
                <span class="disclosure-section__label">
                  <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-palette" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg> Farbe
                </span>
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="disclosure-section__panel" id="musicProfSecColor" hidden>
                <!-- Color picker injected by buildColorOpts() -->
                <div id="musicProfColorOpts" class="color-row" role="radiogroup" aria-label="Akzentfarbe der Playlist"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer u-flex-between">
          <div class="u-flex u-gap-2">
            <button type="button" class="btn btn--sm btn--danger" id="btnDelMusicProfile" style="display:none" aria-label="Playlist löschen">
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-trash" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Löschen
            </button>
          </div>
          <div class="u-flex u-gap-2">
            <button type="button" class="btn btn--sm" data-bs-dismiss="modal">Abbrechen</button>
            <button type="button" class="btn btn--sm btn--accent" id="btnSaveMusicProfile">Speichern</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ═══════════════════════ MUSIK-TRACK BEARBEITEN ═══════════════════════
       Gleicher Editor-Aufbau wie #soundModal (sm-header · sm-basics-bar ·
       sm-body): Name + Aktionen sticky in der Basics-Bar, Kernfelder
       (Künstler/Album/Lautstärke) direkt sichtbar. „Darstellung & Organisation“
       und „Audio-Effekte“ sind — wie beim Sound — Einstiegskarten, die je eine
       eigene Dialogbox öffnen (#musicTrackAppearanceModal und den geteilten
       #soundFxModal im Musik-Kontext, s.u.); die Audio-Effekte-Karte trägt denselben Ein/Aus-Schalter
       (.fx-toggle) wie #soundModal. Kein „Wiedergabe & Verhalten“: ein
       Musik-Track hat kein eigenes Wiedergabe-Datenmodell (Crossfade/Autoplay
       gelten für die Playlist -> #musicPlaybackModal), die Lautstärke bleibt
       wie beim Sound direkt im Formular. Alle IDs unverändert
       (js/dialogs/music-modal.js, js/events/register-tile-events.js). -->
  <div class="modal fade" id="musicTrackModal" tabindex="-1" aria-labelledby="musicTrackModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-size-wide">
      <div class="modal-content">

        <div class="modal-header sm-header">
          <h5 class="modal-title" id="musicTrackModalTitle">Musikstück bearbeiten</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>

        <!-- ── STICKY BASICS BAR ─────────────────────────────── -->
        <div class="sm-basics-bar">
          <div class="sm-basics-row">
            <div class="sm-basics-name">
              <input class="form-control sm-name-input" id="musicEditName" maxlength="60" placeholder="Track-Name…"
                aria-label="Trackname">
            </div>
            <div class="sm-basics-actions">
              <button type="button" class="btn btn--sm btn--danger" id="btnMusicEditDelete" aria-label="Löschen">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-trash" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span class="btn__label">Löschen</span>
              </button>
              <button type="button" class="btn btn--sm" id="btnMusicEditExport"
                title="Dieses Musikstück als Datei exportieren" aria-label="Musikstück exportieren">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-download" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><span class="btn__label">Export</span>
              </button>
              <button type="button" class="btn btn--sm" id="btnMusicEditMove"
                title="In eine andere Playlist verschieben" aria-label="Verschieben">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-arrow-right-left" aria-hidden="true"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg><span class="btn__label">Verschieben</span>
              </button>
              <button type="button" class="btn btn--sm" id="btnMusicEditDuplicate"
                title="In eine Playlist duplizieren" aria-label="Duplizieren">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-copy" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg><span class="btn__label">Duplizieren</span>
              </button>
              <button type="button" class="btn btn--sm" data-bs-dismiss="modal">Abbrechen</button>
              <button type="button" class="btn btn--sm btn--accent" id="btnMusicEditSave">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-save" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg> Speichern
              </button>
            </div>
          </div>
        </div>

        <!-- ── SCROLLABLE BODY ────────────────────────────────── -->
        <div class="modal-body sm-body">

          <div class="sm-grid sm-level1">
            <div class="sm-field--half">
              <label class="form-label" for="musicEditArtist">Künstler / Interpret</label>
              <input class="form-control" id="musicEditArtist" maxlength="60">
            </div>
            <div class="sm-field--half">
              <label class="form-label" for="musicEditAlbum">Album</label>
              <input class="form-control" id="musicEditAlbum" maxlength="60">
            </div>
            <div class="sm-field--full">
              <label class="form-label" for="musicEditVol">Lautstärke</label>
              <div class="vol-row">
                <input type="range" class="slider" id="musicEditVol" min="0" max="1" step=".01" value="1"
                  aria-label="Track-Lautstärke">
                <span class="u-text-badge u-text-mono" id="musicEditVolLbl">100%</span>
              </div>
            </div>
          </div>

          <div class="sm-entry-card">
            <div class="sm-entry-card__head">
              <span class="sm-entry-card__preview-icon" id="musicAppearancePreviewIcon" aria-hidden="true">🎵</span>
              <span class="sm-entry-card__title">
                Darstellung &amp; Organisation
                <span class="sm-entry-card__preview-dot" id="musicAppearancePreviewColor" aria-hidden="true"></span>
              </span>
              <button type="button" class="btn btn--sm" id="btnOpenMusicAppearanceModal">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-palette" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg>
                Bearbeiten
              </button>
            </div>
          </div>

          <!-- Audio-Effekte: identische Karte wie in #soundModal — Ein/Aus-Schalter,
               Titel + Aktiv-Badge, „Bearbeiten“, Überblick. Zustand = effects.enabled
               des gestagten Effekt-Objekts (_musicEditEffects, music-modal.js). -->
          <div class="sm-entry-card">
            <div class="sm-entry-card__head">
              <label class="fx-toggle sm-inline-toggle" title="Effekte ein/aus">
                <input type="checkbox" role="switch" id="musicEditFxEnabled" aria-label="Audio-Effekte ein/aus">
                <span class="fx-toggle__track"></span>
              </label>
              <span class="sm-entry-card__title">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-audio-lines" aria-hidden="true"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
                Audio-Effekte
                <span class="sm-fx-badge" id="musicEditFxBadge" style="display:none">●</span>
              </span>
              <button type="button" class="btn btn--sm" id="btnOpenMusicTrackFxModal">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-sliders-horizontal" aria-hidden="true"><path d="M10 5H3"/><path d="M12 19H3"/><path d="M14 3v4"/><path d="M16 17v4"/><path d="M21 12h-9"/><path d="M21 19h-5"/><path d="M21 5h-7"/><path d="M8 10v4"/><path d="M8 12H3"/></svg>
                Bearbeiten
              </button>
            </div>
            <div class="sm-fx-summary u-mt-2" id="musicEditFxSummary" aria-live="polite"></div>
          </div>

        </div><!-- /sm-body -->

      </div>
    </div>
  </div>

  <!-- ═════════════ MUSIK-TRACK: DARSTELLUNG & ORGANISATION (DIALOGBOX) ═════════════
       Icon + Farbe — identischer Aufbau wie #soundAppearanceModal. Ein Musik-Track
       hat keine weiteren Organisationsfelder (Künstler/Album bleiben direkt im
       Hauptformular). Picker: dieselben zentralen buildIconGrid()/buildColorOpts(). -->
  <div class="modal fade" id="musicTrackAppearanceModal" tabindex="-1"
    aria-labelledby="musicTrackAppearanceModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-size-wide">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="musicTrackAppearanceModalTitle">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-palette" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg>
            Darstellung &amp; Organisation
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>
        <div class="modal-body sm-body">
          <div class="disclosure-group" id="musicAppearanceDisclosureGroup">

            <div class="disclosure-section">
              <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
                aria-expanded="true" aria-controls="musicApSecIcon" id="musicApSecIconToggle">
                <span class="disclosure-section__label">
                  <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-face-slightly-smiling" aria-hidden="true"><path d="M15 10V9"/><path d="M16.472 15a6 6 0 01-8.943 0"/><path d="M9 10V9"/><circle cx="12" cy="12" r="10"/></svg> Icon
                </span>
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="disclosure-section__panel" id="musicApSecIcon">
                <!-- Icon picker injected by buildIconGrid() -->
                <div id="musicIconGrid" class="icon-grid" aria-hidden="true"></div>
                <input class="form-control icon-direct-input u-mt-2" id="musicIconInput" placeholder="🎵" maxlength="4"
                  aria-label="Emoji direkt eingeben">
              </div>
            </div>

            <div class="disclosure-section">
              <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
                aria-expanded="false" aria-controls="musicApSecColor" id="musicApSecColorToggle">
                <span class="disclosure-section__label">
                  <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-palette" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg> Farbe
                </span>
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="disclosure-section__panel" id="musicApSecColor" hidden>
                <span class="form-label" id="musicClrLabel">Akzentfarbe</span>
                <!-- Color swatches injected by buildColorOpts() -->
                <div class="color-row" id="musicClrOpts" role="radiogroup" aria-labelledby="musicClrLabel"></div>
              </div>
            </div>

          </div>
        </div>
        <div class="modal-footer u-flex-between">
          <span class="u-text-muted u-text-badge">Änderungen wirken erst nach dem Speichern des Musikstücks.</span>
          <button type="button" class="btn btn--sm btn--accent" data-bs-dismiss="modal">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-check" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Fertig
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═════════════ MUSIK-TRACK: AUDIO-EFFEKTE ═════════════
       Bewusst KEIN eigener Dialog: „Bearbeiten“ in der Karte „Audio-Effekte“ (#btnOpenMusicTrackFxModal)
       öffnet den vollständigen, geteilten #soundFxModal (fragments/modals/sound-fx.html) im
       Musik-Kontext — dieselben Gruppen, Presets und Controls wie bei Sound/Ambient, ohne
       zweite Kopie der ~230 Feld-IDs. Draft-Verhalten: s. openMusicFxEditor()/commitMusicFxDraft()
       in js/dialogs/music-modal.js (Änderungen landen erst beim Speichern im Track). -->

  <!-- ═════════════════════════ WIEDERGABE-DIALOG (MUSIK) ════════════════════════
       Crossfade + Autoplay, analog zu #playbackSettingsModal (Sound).
       #musicCrossfade/#musicAutoplay: state bleibt APP.music.crossfade/
       APP.music.autoplay, s. setMusicCrossfade()/setMusicAutoplay(). -->
  <div class="modal fade" id="musicPlaybackModal" tabindex="-1" aria-labelledby="musicPlaybackModalTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-size-standard">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="musicPlaybackModalTitle">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-play" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
            Wiedergabe
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
