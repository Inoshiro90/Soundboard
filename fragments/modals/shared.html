<!--
  Fragment: shared.html  ·  Familie: Global
  Zweck:    Globale/geteilte Dialoge
  Modals:   playbackSettingsModal, soundVolumeModal, profModal, macroModal, macroItemPickerModal
  JS:       js/events/register-tile-events.js, js/events/register-macro-events.js, js/dialogs/profile-modals.js, js/dialogs/macro-modal.js
  Geladen:  js/fragmentLoader.js (Liste in js/main.js), VOR registerEvents() — IDs/Klassen/ARIA unverändert.
-->

  <!-- ═════════════════════════ WIEDERGABE-DIALOG (GLOBAL) ═══════════════════════
       GLOBALE Soundboard-Wiedergabeoptionen (Überlagern/Stop bei Neustart/
       Mehrfachklick/Auto Duck) — betreffen ALLE Sound-Kacheln gleichzeitig,
       im Gegensatz zu #soundPlaybackModal, das "Wiedergabe & Verhalten"
       NUR des gerade bearbeiteten Sounds regelt. Alle Feld-IDs
       (setOverlap/setStopReplay/setMultiClick/setAutoDuck/
       setAutoDuckAmount) hängen an der Event-Logik in
       js/events/register-toolbar-events.js (setOverlap() etc.,
       APP.globalSettings). -->
  <div class="modal fade" id="playbackSettingsModal" tabindex="-1" aria-labelledby="playbackSettingsModalTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content sm-content">
        <div class="modal-header">
          <h5 class="modal-title" id="playbackSettingsModalTitle">
            <i class="fa-solid fa-sliders" aria-hidden="true"></i>
            Wiedergabe
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>
        <div class="modal-body sm-body">
          <label class="popover-check" title="Mehrere Sounds können gleichzeitig abspielen">
            <input type="checkbox" id="setOverlap" checked>
            Überlagern
          </label>
          </br>
          <label class="popover-check" title="Klick auf laufenden Sound stoppt ihn">
            <input type="checkbox" id="setStopReplay">
            Stop bei Neustart
          </label>
          </br>
          <label class="popover-check" title="Mehrfachklick erzeugt überlagerte Kopien">
            <input type="checkbox" id="setMultiClick" checked>
            Mehrfachklick
          </label>
          </br>
          <!-- Senkt die Ambient-Ebene automatisch ab, solange mindestens ein
               Sound-Kachel-Sound spielt (audio/playback.js
               notifyDuckTrigger()/notifyDuckRelease() +
               ambient/ambient-playback.js duckAmbient()). Hier statt im
               Sound-FX-Modal, da GLOBAL wirksam, nicht pro Sound. -->
          <label class="popover-check" title="Ambient-Lautstärke automatisch absenken, solange ein Sound spielt">
            <input type="checkbox" id="setAutoDuck">
            Auto Duck (Ambient)
          </label>
          <div class="u-flex u-gap-2 u-mt-1" id="autoDuckAmountRow" style="align-items:center">
            <span class="u-text-muted u-text-badge">Stärke</span>
            <input type="range" class="slider" id="setAutoDuckAmount" min="0" max="1" step="0.05" value="0.7"
              style="flex:1;max-width:100px">
            <span class="u-text-muted u-text-badge" id="setAutoDuckAmountLbl">70%</span>
          </div>
        </div>
        <div class="modal-footer u-flex-between">
          <span></span>
          <button class="btn btn--sm btn--accent" data-bs-dismiss="modal">
            <i class="fa-solid fa-check" aria-hidden="true"></i> Fertig
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════ LAUTSTÄRKE-DIALOG (SOUND) ══════════════════════
       #masterVol/#masterVolNum bleiben APP.globalSettings.masterVol, keine
       Kopie in einen neuen Zustand. -->
  <div class="modal fade" id="soundVolumeModal" tabindex="-1" aria-labelledby="soundVolumeModalTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content sm-content">
        <div class="modal-header">
          <h5 class="modal-title" id="soundVolumeModalTitle">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path
                d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
              <path d="M16 9a5 5 0 0 1 0 6" />
              <path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
            </svg>
            Lautstärke
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>
        <div class="modal-body sm-body">
          <div class="u-flex u-gap-2" style="align-items:center">
            <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
            <input type="range" id="masterVol" class="slider" style="flex:1" min="0" max="1" step=".01" value="1"
              aria-label="Lautstärke Slider">
            <input type="number" id="masterVolNum" class="menubar-volume__number" min="0" max="100" value="100"
              aria-label="Lautstärke Prozent">
            <span class="u-text-muted u-text-badge">%</span>
          </div>
        </div>
        <div class="modal-footer u-flex-between">
          <span></span>
          <button class="btn btn--sm btn--accent" data-bs-dismiss="modal">
            <i class="fa-solid fa-check" aria-hidden="true"></i> Fertig
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════ MACRO MODAL ══════════════════════════════════ -->
  <div class="modal fade" id="macroModal" tabindex="-1" aria-labelledby="mMTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="mMTitle">Makro</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>

        <div class="modal-body">
          <div class="row g-3 mb-2">
            <div class="col-sm-5">
              <label class="form-label" for="mName">Name</label>
              <input class="form-control" id="mName" placeholder="Makro-Name">
            </div>
            <div class="col-sm-3">
              <label class="form-label" for="mRepeat">Wiederholen</label>
              <input type="number" class="form-control" id="mRepeat" min="1" max="999" value="1">
            </div>
            <div class="col-sm-4">
              <label class="form-label" for="mHotkey">Hotkey</label>
              <input type="text" class="hotkey-field" id="mHotkey" placeholder="Klick + Tasten" readonly>
            </div>
          </div>

          <!-- Erweiterte Einstellungen: Icon, Abspiel-Modus, Farben, Wdh.-Pause —
               seltener angepasst als Name/Hotkey/Wiederholen, daher standardmäßig
               eingeklappt (gleiches Accordion-Muster wie im Sound-Editor). -->
          <div class="sm-section u-mb-2">
            <button class="sm-section-toggle" data-target="mAdvanced">
              <span><i class="fa-solid fa-sliders" aria-hidden="true"></i> Erweiterte Einstellungen</span>
              <i class="fa-solid fa-chevron-down sm-chevron" aria-hidden="true"></i>
            </button>
            <div class="sm-section-body" id="mAdvanced" style="display:none">

              <div class="row g-2 mb-2 u-mt-1">
                <div class="col-sm-6">
                  <label class="form-label" for="mRepDelay">Pause zw. Wiederholungen (ms)</label>
                  <input type="number" class="form-control" id="mRepDelay" min="0" value="500">
                </div>
                <div class="col-sm-6">
                  <label class="form-label" for="mPlayMode">Abspiel-Modus</label>
                  <select class="form-select" id="mPlayMode">
                    <option value="parallel">Parallel — alle gleichzeitig</option>
                    <option value="sequential">Sequenziell — nacheinander warten</option>
                    <option value="random">Zufällig — zufällige Reihenfolge</option>
                  </select>
                </div>
              </div>
              <p class="u-text-muted u-text-badge u-line-height-sm u-mb-2">
                <strong>Sequenziell:</strong> nächster Schritt startet wenn vorheriger Sound fertig ist.
                <strong>Parallel:</strong> alle starten sofort.
              </p>

              <div class="row g-2 mb-2">
                <div class="col-12">
                  <label class="form-label">Icon</label>
                  <div id="mIconGrid" class="icon-grid-makro" aria-hidden="true"></div>
                  <input class="form-control u-mt-2" id="mIcon" placeholder="🪄" maxlength="4"
                    style="font-size:1rem;text-align:center" aria-label="Emoji direkt eingeben">
                </div>
                <input type="hidden" id="mTileW">
                <input type="hidden" id="mTileH">
              </div>

              <div class="mb-2">
                <label class="form-label">Farbe (Akzent)</label>
                <div class="color-row" id="mClrOpts" role="radiogroup" aria-label="Farbe wählen"></div>
              </div>
              <div class="mb-1">
                <label class="form-label">Kachel-Hintergrund</label>
                <!-- Gleiche Farbpalette wie beim Sound-Editor -->
                <div class="color-row" id="mTileClrOpts" role="radiogroup" aria-label="Makro Kachel-Hintergrundfarbe">
                </div>
                <input type="hidden" id="mTileClr">
              </div>

            </div>
          </div>

          <label class="form-label">
            Schritte
            <small class="u-text-muted u-text-badge">
              — Sounds, Makros oder Aktionen (Stop, Fade, Lautstärke)
            </small>
          </label>

          <!-- Makro-Timeline: Sounds & Makros visuell anordnen -->
          <div class="macro-tl-wrap">
            <div class="macro-tl-toolbar">
              <div class="u-flex u-gap-2" style="align-items:center;flex:1;flex-wrap:wrap;gap:6px">
                <!-- Hinzufügen-Button -->
                <button class="btn btn--sm btn--accent" id="btnAddStep" aria-label="Sound oder Makro hinzufügen">
                  <i class="fa-solid fa-music" aria-hidden="true"></i> + Sound/Makro
                </button>

                <div class="menubar-sep" aria-hidden="true"></div>

                <button class="btn btn--sm" id="btnMacroTlPreview" title="Timeline vorhören" aria-label="Vorhören">
                  <i class="fa-solid fa-play" aria-hidden="true"></i>
                </button>
                <button class="btn btn--sm" id="btnMacroTlStop" title="Stop" aria-label="Stop">
                  <i class="fa-solid fa-square" aria-hidden="true"></i>
                </button>

                <div class="menubar-sep" aria-hidden="true"></div>

                <label class="u-text-muted" style="font-size:var(--text-badge);white-space:nowrap">Snap</label>
                <select id="macroTlSnap" class="form-select form-select-sm" style="width:76px;font-size:0.72rem">
                  <option value="0">Aus</option>
                  <option value="50" selected>50 ms</option>
                  <option value="100">100 ms</option>
                  <option value="250">250 ms</option>
                </select>
                <label class="u-text-muted" style="font-size:var(--text-badge);white-space:nowrap">Zoom</label>
                <input type="range" id="macroTlZoom" min="40" max="600" step="20" value="120" class="slider"
                  style="width:70px" aria-label="Zoom">
              </div>
            </div>
            <p class="u-text-muted" style="font-size:var(--text-badge);margin:4px 6px 2px">
              <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
              Ziehen = verschieben · Rechtsklick = entfernen · Mausrad = Zoom
            </p>
            <div class="macro-tl-scroll">
              <canvas id="macroTimelineCanvas" style="display:block;cursor:crosshair;width:100%"></canvas>
            </div>
          </div>

          <!-- Versteckte Datenliste (nur Datenhaltung, nicht sichtbar) -->
          <div id="mStepList" style="display:none" aria-hidden="true"></div>

        </div>

        <div class="modal-footer u-flex-between">
          <div class="u-flex u-gap-2">
            <button class="btn" id="btnTestMacro" aria-label="Makro testen">
              <i class="fa-solid fa-play" aria-hidden="true"></i> Test
            </button>
            <button class="btn btn--danger" id="btnDelMacro" style="display:none" aria-label="Makro löschen">
              <i class="fa-solid fa-trash" aria-hidden="true"></i> Löschen
            </button>
          </div>
          <div class="u-flex u-gap-2">
            <button class="btn" data-bs-dismiss="modal">Abbrechen</button>
            <button class="btn btn--accent" id="btnSaveMacro">Speichern</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ═══════════════════════════ PROFILE MODAL ════════════════════════════════ -->
  <div class="modal fade" id="profModal" tabindex="-1" aria-labelledby="profModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="profModalTitle">Profil</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>

        <div class="modal-body">
          <label class="form-label" for="profNameInput">Name</label>
          <input class="form-control" id="profNameInput" placeholder="z.B. Zauberer Sammy">

          <!-- Icon/Farbe als gemeinsame Progressive-Disclosure-Gruppe
               (data-disclosure-inline, zentrales System aus disclosure.js) —
               standardmäßig eingeklappt. Audio-Effekte leben im eigenen
               Toolbar-Button/-Dialog (#soundFxToolbarModal, s.u. im
               Dokument) für das jeweils AKTIVE Profil. -->
          <div class="disclosure-group u-mt-3" id="profDisclosureGroup">

            <div class="disclosure-section">
              <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
                aria-expanded="false" aria-controls="profSecIcon" id="profSecIconToggle">
                <span class="disclosure-section__label">
                  <i class="fa-solid fa-face-smile" aria-hidden="true"></i> Emoji / Icon
                </span>
                <i class="fa-solid fa-chevron-down disclosure-section__chevron" aria-hidden="true"></i>
              </button>
              <div class="disclosure-section__panel" id="profSecIcon" hidden>
                <!-- Icon picker injected by buildIconGrid() -->
                <div id="profIconGrid" class="icon-grid" aria-hidden="true"></div>
                <input class="form-control u-mt-2" id="profIconInput" placeholder="🧙" maxlength="4"
                  style="font-size:1.1rem;text-align:center" aria-label="Emoji direkt eingeben">
              </div>
            </div>

            <div class="disclosure-section">
              <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
                aria-expanded="false" aria-controls="profSecColor" id="profSecColorToggle">
                <span class="disclosure-section__label">
                  <i class="fa-solid fa-palette" aria-hidden="true"></i> Farbe
                </span>
                <i class="fa-solid fa-chevron-down disclosure-section__chevron" aria-hidden="true"></i>
              </button>
              <div class="disclosure-section__panel" id="profSecColor" hidden>
                <!-- Color picker injected by buildColorOpts() -->
                <div id="profColorOpts" class="color-row" aria-label="Akzentfarbe des Profils"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer u-flex-between">
          <div class="u-flex u-gap-2">
            <button class="btn btn--danger" id="btnDelProfile" style="display:none" aria-label="Profil löschen">
              <i class="fa-solid fa-trash" aria-hidden="true"></i> Löschen
            </button>
          </div>
          <div class="u-flex u-gap-2">
            <button class="btn" data-bs-dismiss="modal">Abbrechen</button>
            <button class="btn btn--accent" id="btnSaveProfile">Speichern</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ══ MAKRO: SOUND / MAKRO AUSWAHL ════════════════════════════════════════ -->
  <div class="modal fade" id="macroItemPickerModal" tabindex="-1" aria-labelledby="macroItemPickerTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="macroItemPickerTitle">
            <i class="fa-solid fa-music" aria-hidden="true"></i> Sound oder Makro wählen
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>
        <div class="modal-body" style="padding:12px">
          <input type="search" id="macroItemSearch" class="form-control form-control-sm mb-2" placeholder="Suchen…"
            aria-label="Suchen" autocomplete="off">
          <div id="macroItemPickerList" class="tl-picker-list" role="listbox" style="max-height:55vh;overflow-y:auto"
            aria-label="Sounds und Makros"></div>
        </div>
        <div class="modal-footer" style="padding:8px 12px">
          <button class="btn btn--sm" data-bs-dismiss="modal">Abbrechen</button>
          <button class="btn btn--sm btn--accent" id="btnMacroItemInsert" disabled>
            <i class="fa-solid fa-plus" aria-hidden="true"></i> Hinzufügen
          </button>
        </div>
      </div>
    </div>
  </div>
