<!--
  Fragment: sound-fx.html  ·  Familie: Sound
  Zweck:    Audio-Effekte eines Sounds / Ambient-Tracks / Musikstücks — ÜBERSICHT (Ebene 1)
  Modals:   soundFxModal   (Ebene 2 + 3: fragments/modals/sound-fx-pipeline.html)
  JS:       js/ui/fx-pipeline-editor.js, js/events/register-effects-events.js, js/dialogs/sound-modal.js
  Geladen:  js/fragmentLoader.js (Liste in js/main.js), VOR registerEvents() — IDs/Klassen/ARIA unverändert.
-->

  <!-- ═════════════════════════ AUDIO-EFFEKTE DIALOG ═══════════════════════════
       Eigene Dialogbox statt langer Accordion-Liste im Sound-Editor (siehe
       "sm-fx-entry" dort) — schafft Platz im Hauptformular und hält Filter/
       EQ/Dynamik/Distortion/Reverb/Delay/Spatial/Erweitert/Export als
       zusammengehörige, aber klar sekundäre Einheit beisammen. Wird über
       #soundModal geöffnet und bleibt technisch unabhängig: alle Feld-IDs
       sind unverändert, writeEffectsToUI()/readEffectsFromUI() lesen und
       schreiben sie unabhängig davon, in welchem Dialog sie gerade liegen. -->
  <div class="modal fade" id="soundFxModal" tabindex="-1" aria-labelledby="soundFxModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-size-editor modal-fixed-h">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title" id="soundFxModalTitle">
            <svg xmlns="http://www.w3.org/2000/svg" class="svg-modal-title" style="margin-right:0.5rem" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-audio-lines" aria-hidden="true"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
            Audio-Effekte
          </span>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg></button>
        </div>
        <div class="modal-body sm-body">
          <!-- EBENE 1 · ÜBERSICHT: vier kompakte Stufen-Karten (Icon, Name, Schalter, Status, „Layer verwalten“).
               Verwaltung (Ebene 2) und Layer-Details (Ebene 3) liegen in eigenen Modals
               (fragments/modals/sound-fx-pipeline.html). Karten rendert js/ui/fx-pipeline-editor.js. -->
          <div class="fx-pipeline" id="fxPipelineEditor">
            <div class="fx-pipeline__seq u-text-muted u-text-badge" id="fxPipelineSequence" aria-live="polite"></div>
            <div class="fx-stages" id="fxPipelineStages"></div>
          </div>

          <!-- Export (nur Sound-Kontext, s. _setModalContext): betrifft den ganzen Sound, nicht einen Layer. -->
          <div class="disclosure-group sm-level1 u-mt-3" id="fxExportGroup" data-disclosure-multi>
          <!-- 10. Export -->
          <div class="disclosure-section sm-sound-only">
            <button type="button" class="disclosure-section__toggle" data-disclosure-toggle data-disclosure-inline
              aria-expanded="false" aria-controls="smFxExport" id="smFxExportToggle">
              <span class="disclosure-section__label">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-download" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg> Export
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-chevron-down disclosure-section__chevron" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="disclosure-section__panel" id="smFxExport" hidden>
              <div class="u-flex u-gap-2 u-wrap" style="padding:var(--space-3) 0;align-items:center">
                <span class="u-text-muted" style="font-size:var(--text-badge);flex:1">
                  <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-file-music" aria-hidden="true"><path d="M11.65 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v10.35"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M8 20v-7l3 1.474"/><circle cx="6" cy="20" r="2"/></svg>
                  Aktuellen Sound (inkl. Trim, Effekte, Pitch) exportieren
                </span>
                <button type="button" class="btn btn--sm btn--accent" id="btnExportWav"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-download"
                    aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg> WAV</button>
                <button type="button" class="btn btn--sm" id="btnExportMp3"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-music" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                  MP3</button>
                <button type="button" class="btn btn--sm btn-export-full" id="btnExportFull" title="JSON inkl. Audio"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-archive" aria-hidden="true"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg> JSON</button>
              </div>
            </div>
          </div>
          </div>
        </div>
        <div class="modal-footer u-flex-between">
          <span class="u-text-muted u-text-badge" id="fxModalFooterHint">Änderungen wirken sofort auf die Vorschau.</span>
          <div class="u-flex u-gap-2">
            <button type="button" class="btn btn--sm" id="btnPreviewFx" aria-label="Vorschau abspielen" title="Vorschau abspielen" aria-pressed="false">
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-play u-text-accent" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg><span class="btn__label">Vorschau</span>
            </button>
            <button type="button" class="btn btn--sm btn--accent" data-bs-dismiss="modal">
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ui-icon lucide lucide-check" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Fertig
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
